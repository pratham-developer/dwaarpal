events {
    worker_connections 4096;
}

http {
    upstream dwaarpal_api {
        # Docker's internal DNS will round-robin across all instances of the dwaarpal-api service
        server dwaarpal-api:8080;
        
        # Keep connections alive to prevent TCP handshakes from bottlenecking the benchmark
        keepalive 100;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://dwaarpal_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
