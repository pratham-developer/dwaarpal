version: '3.8'

services:
  api:
    build: ..
    container_name: dwaarpal-api
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - PORT=8080
      - REDIS_ADDRESS=redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7.2-alpine
    container_name: dwaarpal-redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: dwaarpal-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: dwaarpal-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
